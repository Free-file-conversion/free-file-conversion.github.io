    <script>
        // --- View Switching Logic ---
        function switchView(view) {
            const gamesView = document.getElementById("games-view");
            const settingsView = document.getElementById("settings-view");
            const btnGames = document.getElementById("btn-games");
            const btnSettings = document.getElementById("btn-settings");

            if (view === 'settings') {
                gamesView.style.display = "none";
                settingsView.style.display = "block";
                btnSettings.classList.add("active");
                btnGames.classList.remove("active");
            } else {
                settingsView.style.display = "none";
                gamesView.style.display = "block";
                btnGames.classList.add("active");
                btnSettings.classList.remove("active");
            }
        }

        // --- Tab Cloak Presets & Logic ---
        const cloaks = [
            {
                id: "default",
                name: "Default",
                title: "Premium Conversion Software - New Exclusive Discount: Up to 60% off!",
                icon: ""
            },
            {
                id: "powerschool",
                name: "PowerSchool",
                title: "Grades and Attendance",
                icon: "https://www.google.com/s2/favicons?domain=powerschool.com&sz=64"
            },
            {
                id: "drive",
                name: "Google Drive",
                title: "My Drive - Google Drive",
                icon: "https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png"
            },
            {
                id: "chrome",
                name: "Google Chrome",
                title: "New Tab",
                icon: "https://www.google.com/chrome/static/images/favicons/favicon-32x32.png"
            },
            {
                id: "scratch",
                name: "Scratch",
                title: "Scratch - Imagine, Program, Share",
                icon: "https://scratch.mit.edu/favicon.ico"
            },
            {
                id: "classroom",
                name: "Google Classroom",
                title: "Home",
                icon: "https://ssl.gstatic.com/classroom/favicon.png"
            },
            {
                id: "docs",
                name: "Google Docs",
                title: "Untitled document - Google Docs",
                icon: "https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico"
            },
            {
                id: "canvas",
                name: "Canvas",
                title: "Dashboard",
                icon: "https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico"
            },
            {
                id: "clever",
                name: "Clever",
                title: "Clever | Portal",
                icon: "https://www.google.com/s2/favicons?domain=clever.com&sz=64"
            }
        ];

        function setCloak(title, icon, id = "custom") {
            document.title = title;
            const favicon = document.getElementById("favicon");
            favicon.href = icon;

            // Save to localStorage
            localStorage.setItem("cloakTitle", title);
            localStorage.setItem("cloakIcon", icon);
            localStorage.setItem("cloakId", id);

            // Highlight selected preset card
            document.querySelectorAll(".cloak-card").forEach(card => {
                card.classList.remove("selected");
                if (card.dataset.id === id) {
                    card.classList.add("selected");
                }
            });
        }

        function applyCustomCloak() {
            const customTitle = document.getElementById("custom-title").value.trim();
            const customIcon = document.getElementById("custom-icon").value.trim();
            if (customTitle) {
                setCloak(customTitle, customIcon, "custom");
            }
        }

        function initCloaks() {
            const grid = document.getElementById("cloak-grid");
            const savedId = localStorage.getItem("cloakId") || "default";

            cloaks.forEach(cloak => {
                const card = document.createElement("div");
                card.className = "cloak-card" + (cloak.id === savedId ? " selected" : "");
                card.dataset.id = cloak.id;
                card.onclick = () => setCloak(cloak.title, cloak.icon, cloak.id);

                if (cloak.icon) {
                    const img = document.createElement("img");
                    img.src = cloak.icon;
                    img.alt = cloak.name;
                    card.appendChild(img);
                }

                const label = document.createElement("span");
                label.innerText = cloak.name;
                card.appendChild(label);

                grid.appendChild(card);
            });

            // Restore saved cloak on page load
            const savedTitle = localStorage.getItem("cloakTitle");
            const savedIcon = localStorage.getItem("cloakIcon");
            if (savedTitle) {
                document.title = savedTitle;
                if (savedIcon !== null) {
                    document.getElementById("favicon").href = savedIcon;
                }
            }
        }

        initCloaks();

        // --- Original Game Loading Logic ---
        function loadGame(game) {
            localStorage.setItem("g", game);
            window.location.href = "/assets/iframe.html";
        }

        async function loadGmsJson() { // doogile
            const div = document.getElementById("links");

            const response = await fetch("/assets/gms.json");
            const json = await response.json();
            for (const {name, path} of json) {
                let a = document.createElement("a");
                a.href = path;
                a.innerText = name + "\n";

                div.appendChild(a);
            }
        }

        loadGmsJson();
    </script>
    <script>                
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const finePointerQuery = window.matchMedia('(pointer: fine)');
        const hoverQuery = window.matchMedia('(hover: hover)');
        const pointer = document.querySelector('.pointer');
        function setupPointer() {
          const shouldRun =
            !prefersReducedMotion &&
            finePointerQuery.matches &&
            hoverQuery.matches;
          if (!pointer) return;
          if (!shouldRun) {
            pointer.style.display = 'none';
            return;
          }
          pointer.style.display = 'block';
          let mouseX = 0;
          let mouseY = 0;
          let frame = null;
          const update = () => {
            pointer.style.setProperty('--mouseX', mouseX + 'px');
            pointer.style.setProperty('--mouseY', mouseY + 'px');
            frame = null;
          };
          window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (!frame) {
              frame = requestAnimationFrame(update);
            }
          });
        }
        setupPointer();
    </script>
